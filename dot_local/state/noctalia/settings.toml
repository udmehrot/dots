config_version = 14

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.91999997943639755
    capsule_radius = 3
    capsule_thickness = 0.65999998897314072
    end = [
        "media",
        "tray",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "battery",
        "control-center",
        "bar",
        "notifications",
        "session"
    ]
    font_family = "Ioskeley Mono"
    margin_ends = 0
    radius = 0
    scale = 1.2500000111758709
    thickness = 40

[idle]
behavior_order = [ "lock", "screen-off" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    command = ""
    enabled = true
    locked_timeout = 0.0
    resume_command = ""
    timeout = 300.0

    [idle.behavior.screen-off]
    action = "screen_off"
    command = "swaymsg \"output * power off\""
    enabled = true
    locked_timeout = 0.0
    resume_command = "swaymsg \"output * power on\""
    timeout = 600.0

[location]
address = "Apex, NC"

[lockscreen]
allow_empty_password = false
blur_intensity = 0.5
blurred_desktop = true
edge_smoothness = 0.3
enabled = true
fingerprint = true
lock_before_suspend = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1536.0
    cy = 1546.0
    output = "DP-2"
    placement_height = 1728.0
    placement_width = 3072.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[plugins]
enabled = [
    "prponkshe/umbriel-displays",
    "noctalia/wallhaven",
    "davemhammer/obsidian",
    "yugaaank/better-clock",
    "liamwh/emoji-picker"
]

[shell]
clipboard_enabled = true
font_family = "Ioskeley Mono"
polkit_agent = true

    [shell.screenshot]
    annotate = true
    close_on_copy = true
    close_on_save = true
    confirm_region = false
    copy_to_clipboard = true
    directory = "/home/ud/Pictures/Screenshots"
    freeze_screen = true
    save_to_file = true

[theme]
builtin = "Rosé Pine"
community_palette = "Rose Pine Moon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "vibrant"

[wallpaper.default]
path = "/home/ud/Pictures/Walls/os/arch-btw.png"

[wallpaper.last]
path = "/home/ud/Pictures/Walls/os/arch-btw.png"

[wallpaper.monitors.DP-2]
path = "/home/ud/Pictures/Walls/wallhaven-og7yyl.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/ud/Pictures/Walls/os/arch-btw.png"

[weather]
unit = "imperial"

[widget.bar]
type = "prponkshe/umbriel-displays:bar"

[widget.clock]
format = "{:%b %d}  {:%H:%M:%S}"

[widget.network]
show_label = false

[widget.workspaces]
style = "minimal"