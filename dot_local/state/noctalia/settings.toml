config_version = 14

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1536.0
    cy = 1546.0
    output = "DP-2"
    placement_height = 1728.0
    placement_width = 3072.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Ioskeley Mono"
polkit_agent = true
clipboard_enabled = true

    [shell.screenshot]
    annotate = true
    close_on_copy = true
    close_on_save = true
    confirm_region = false
    copy_to_clipboard = true
    directory = "/home/ud/Pictures/Screenshots"
    freeze_screen = true
    save_to_file = true

[theme]
builtin = "Rosé Pine"

[wallpaper.default]
path = "/home/ud/Pictures/Walls/illustration/something-beautiful-in-nature.jpg"

[wallpaper.last]
path = "/home/ud/Pictures/Walls/illustration/something-beautiful-in-nature.jpg"

[wallpaper.monitors.DP-2]
path = "/home/ud/Pictures/Walls/illustration/something-beautiful-in-nature.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/ud/Pictures/Walls/illustration/something-beautiful-in-nature.jpg"