<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <!-- Keep Inter for text while prioritizing color emoji as its fallback. -->
  <match target="pattern">
    <test qual="any" name="family" compare="eq"><string>Inter</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>
</fontconfig>
